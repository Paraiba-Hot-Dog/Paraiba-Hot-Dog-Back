services:
  paraiba-hotdog-back:
    command: >
      sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paraiba_hotdog_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      SMTP_RECUPERACAO_SENHA_HOST: ${SMTP_RECUPERACAO_SENHA_HOST:-mailhog}
      SMTP_RECUPERACAO_SENHA_PORT: ${SMTP_RECUPERACAO_SENHA_PORT:-1025}
      SMTP_RECUPERACAO_SENHA_USERNAME: ${SMTP_RECUPERACAO_SENHA_USERNAME:-}
      SMTP_RECUPERACAO_SENHA_PASSWORD: ${SMTP_RECUPERACAO_SENHA_PASSWORD:-}
      SMTP_RECUPERACAO_SENHA_FROM_EMAIL: ${SMTP_RECUPERACAO_SENHA_FROM_EMAIL:-recuperacao@paraibahotdog.local}
      SMTP_RECUPERACAO_SENHA_FROM_NAME: ${SMTP_RECUPERACAO_SENHA_FROM_NAME:-Paraiba Hot Dog}
      SMTP_RECUPERACAO_SENHA_STARTTLS: ${SMTP_RECUPERACAO_SENHA_STARTTLS:-false}
      SMTP_RECUPERACAO_SENHA_SSL: ${SMTP_RECUPERACAO_SENHA_SSL:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      RESET_SENHA_TOKEN_MINUTOS: ${RESET_SENHA_TOKEN_MINUTOS:-30}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paraiba_hotdog_db}
    ports:
      - "5433:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
